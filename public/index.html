<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var KEY = "has-telefoon-v1";
  var S = { needKey: false, data: null, from: "", stamp: "", sel: null, tab: "h", status: "", err: "", busy: false, q: "", flt: "all", list: [] };

  function store(get, val) { try { return get ? localStorage.getItem(KEY) : localStorage.setItem(KEY, val); } catch (e) { return null; } }
  function nice(d) { if (!d) return ""; var m = String(d).match(/^(\d{4})-(\d\d)-(\d\d)/); if (!m) return d; var dt = new Date(+m[1], +m[2] - 1, +m[3]); return dt.toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" }); }
  function short(club) { return club; }
  function isScorers(x) {
    x = String(x || "");
    if (/^\s*(doelpuntenmakers|topscorers?|assists?|topscoorders?)\b/i.test(x)) return true;
    var m = x.match(/[A-ZÀ-Ý][\w'.\-]+(?:\s+[\w'.\-]+){0,3}\s+\d{1,2}\s*[,.]/g);
    return !!(m && m.length >= 3);
  }
  function cardsHere(co, date) {
    var cs = (co && co.cards) || [];
    return cs.filter(function (c) { return c.date === date; });
  }
  function cdots(list) {
    return list.map(function (c) { return '<span class="cdot ' + ({ groen: "g", geel: "y", rood: "r" }[c.kind] || "g") + '" title="' + esc(c.kind) + ' kaart"></span>' + (c.minute != null ? '<small class="cc"> ' + esc(c.minute) + "'</small>" : ""); }).join("");
  }
  function matchLabel(m) { return short(m.fixture.home) + " – " + short(m.fixture.away); }
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim(); }

  function accept(json, from, stamp) {
    if (!json || json.app !== "HAS" || !Array.isArray(json.matches)) throw new Error("Dit is geen HAS-telefoonbestand.");
    S.data = json; S.from = from; S.stamp = stamp || json.gemaakt || "";
    if (!S.sel || !json.matches.some(function (m) { return m.fixture.id === S.sel; })) {
      var today = new Date().toISOString().slice(0, 10);
      var next = json.matches.find(function (m) { return m.fixture.date >= today; }) || json.matches[0];
      S.sel = next ? next.fixture.id : null;
    }
  }

  function loadCache() {
    var raw = store(true);
    if (!raw) return;
    try { var c = JSON.parse(raw); accept(c.data, "opgeslagen op deze telefoon", c.stamp); } catch (e) { /* leeg */ }
  }
  function saveCache() { store(false, JSON.stringify({ data: S.data, stamp: S.stamp })); }

  function b64json(b64) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  var KEYK = "has-live-key";
  function getKey() { try { return localStorage.getItem(KEYK) || ""; } catch (e) { return ""; } }
  function setKey(v) { try { if (v) localStorage.setItem(KEYK, v); else localStorage.removeItem(KEYK); } catch (e) { } }
  async function fromDrive() {
    var key = getKey();
    if (!key) { S.needKey = true; render(); return; }
    S.busy = true; S.err = ""; S.status = "Bezig met ophalen..."; render();
    try {
      var r = await fetch("/api/data", { headers: { "x-has-key": key }, cache: "no-store" });
      if (r.status === 401) { setKey(""); S.needKey = true; S.err = "Wachtwoord klopt niet."; }
      else if (r.status === 404) { S.err = "Er staat nog geen bestand op de server. Klik in HAS op Zet op telefoon."; }
      else if (!r.ok) { var e = await r.json().catch(function () { return {}; }); S.err = e.error || "Ophalen lukt niet."; }
      else {
        var j = await r.json();
        accept(j, "HAS-server", j.gemaakt || "");
        S.needKey = false; saveCache(); S.status = "Bijgewerkt."; setTimeout(function () { S.status = ""; render(); }, 2500);
      }
    } catch (e) { S.err = "Geen verbinding. Je ziet de laatst opgeslagen versie."; }
    if (S.err) S.status = "";
    S.busy = false; render();

    var h = st.history || [];
    if (!h.length) return "";
    return '<div class="lab" style="margin-top:12px">Eerdere seizoenen</div><div class="sub">' + h.map(function (x) { return esc(x.season) + ": " + esc(x.goals || 0) + " goals" + ((x.groen || x.geel || x.rood) ? " \u00b7 kaarten " + (x.groen || 0) + "-" + (x.geel || 0) + "-" + (x.rood || 0) : ""); }).join("<br>") + '</div>';
  }
  function openPlayer(pid) {
    var m = cur(), p = S.data.players[pid]; if (!m || !p) return;
    var st = p.stats || {}, lines = linesAbout(m, p), idx = S.list.indexOf(pid);
    var news = (p.digest || []).filter(function (n) { return !isScorers(n.summary) && !lines.some(function (l) { return norm(l) === norm(n.summary); }); });
    var tags = sub2(p.bio);
    var h = '<div class="grab"></div><button class="close" id="xClose" aria-label="Sluiten">&times;</button>' +
      '<div class="lab">#' + (p.number == null ? "-" : esc(p.number)) + " \u00b7 " + esc((p.team && p.team.name) || "") + (p.keeper ? " \u00b7 keeper" : "") + (p.captain ? " \u00b7 aanvoerder" : "") + '</div><h2>' + esc(p.name) + '</h2>' +
      (tags ? '<div class="sub" style="margin-top:2px">' + esc(tags) + '</div>' : "") +
      (p.injury ? '<div class="note err">Geblesseerd: ' + esc(typeof p.injury === "string" ? p.injury : (p.injury.text || p.injury.note || "ja")) + '</div>' : "") +
      '<div class="blocks"><div class="blk"><b>' + esc(st.goals == null ? 0 : st.goals) + '</b><small>doelpunten</small></div><div class="blk"><b>' + esc(st.vd || 0) + "/" + esc(st.sc || 0) + "/" + esc(st.sb || 0) + '</b><small>VD / SC / SB</small></div><div class="blk"><b>' + esc(st.groen || 0) + "-" + esc(st.geel || 0) + "-" + esc(st.rood || 0) + '</b><small>groen-geel-rood</small></div></div>';
    var pr = prestOf(p.bio); if (pr) h += '<div class="note" style="border-style:solid;border-color:var(--accent);margin:8px 0"><div class="lab">\u2605 Prestaties</div>' + esc(String(p.bio.prest).replace(/ \| /g, "; ")) + '</div>';
    h += bioBlock(p) + seasonRows(st) + cardRows(p) + histRows(st);
    if (lines.length) h += '<div class="lab" style="margin-top:12px">In het voorbereidingsdocument</div>' + lines.map(function (x) { return '<div class="line">' + mark(x, p) + '</div>'; }).join("");
    if (news.length) h += '<div class="lab" style="margin-top:12px">Nieuws</div>' + news.map(function (n) { return '<div class="line"><div>' + esc(n.summary) + '</div><div class="src">' + esc(nice(n.date)) + " \u00b7 " + esc(n.title) + '</div></div>'; }).join("");
    if ((p.career || []).length) h += '<div class="lab" style="margin-top:12px">Loopbaan</div><div class="sub">' + p.career.map(function (c) { return esc(c.season) + " " + esc(c.club) + (c.number != null ? " #" + esc(c.number) : ""); }).join("<br>") + '</div>';
    if (p.origin) h += '<div class="lab" style="margin-top:12px">Herkomst</div><div class="sub">' + esc(typeof p.origin === "string" ? p.origin : JSON.stringify(p.origin)) + '</div>';
    h += '<div class="nav"><button id="xPrev"' + (idx > 0 ? "" : " disabled") + '>&lsaquo; Vorige</button><button id="xNext"' + (idx >= 0 && idx < S.list.length - 1 ? "" : " disabled") + '>Volgende &rsaquo;</button></div>';
    $("sheet").innerHTML = h; $("sheetbg").classList.add("on"); $("sheet").scrollTop = 0;
    $("xClose").onclick = closeSheet;
    $("xPrev").onclick = function () { if (idx > 0) openPlayer(S.list[idx - 1]); };
    $("xNext").onclick = function () { if (idx >= 0 && idx < S.list.length - 1) openPlayer(S.list[idx + 1]); };
  }
  function closeSheet() { $("sheetbg").classList.remove("on"); }

  function render() {
    var d = S.data, m = cur(), body = "";
    var qHad = document.activeElement && document.activeElement.id === "q";
    if (S.needKey) body = notes() + keyForm();
    else if (!d || !d.matches.length) body = notes() + empty();
    else if (m) {
      var f = m.fixture;
      body = notes() + scoreboard(m) +
        (isWide() ? '<div class="tabs" role="tablist"><button class="tab" role="tab" data-t="h" aria-selected="' + (S.tab === "h" || S.tab === "a") + '">Spelers van beide teams</button><button class="tab" role="tab" data-t="ov" aria-selected="' + (S.tab === "ov") + '">Info</button><button class="tab" role="tab" data-t="d" aria-selected="' + (S.tab === "d") + '">Duels</button></div>' :
        '<div class="tabs" role="tablist"><button class="tab" role="tab" data-t="h" aria-selected="' + (S.tab === "h") + '">' + esc(f.home) + '</button><button class="tab" role="tab" data-t="a" aria-selected="' + (S.tab === "a") + '">' + esc(f.away) + '</button><button class="tab" role="tab" data-t="ov" aria-selected="' + (S.tab === "ov") + '">Info</button><button class="tab" role="tab" data-t="d" aria-selected="' + (S.tab === "d") + '">Duels</button></div>') +
        (S.tab === "ov" ? tabOverview(m) : (S.tab === "h" || S.tab === "a") && isWide() ? tabBoth(m) : S.tab === "h" ? tabTeam(m, 0) : S.tab === "a" ? tabTeam(m, 1) : tabDuels(m));
    }
    $("app").innerHTML = header() + body;
    var topEl = $("app").querySelector(".top");
    if (topEl) document.documentElement.style.setProperty("--topH", topEl.offsetHeight + "px");
    $("bDrive").disabled = S.busy; $("bDrive").textContent = S.busy ? "Bezig..." : "Vernieuwen"; var pg = $("pwGo"); if (pg) { pg.onclick = function () { var v = $("pw").value.trim(); if (v) { setKey(v); S.needKey = false; S.err = ""; fromDrive(); } }; $("pw").onkeydown = function (e) { if (e.key === "Enter") pg.click(); }; }
    $("app").querySelectorAll("[data-m]").forEach(function (b) { b.onclick = function () { S.sel = +b.dataset.m; S.q = ""; S.flt = "all"; render(); window.scrollTo(0, 0); }; });
    $("app").querySelectorAll("[data-t]").forEach(function (b) { b.onclick = function () { S.tab = b.dataset.t; S.q = ""; S.flt = "all"; render(); }; });
    $("app").querySelectorAll("[data-f]").forEach(function (b) { b.onclick = function () { S.flt = b.dataset.f; render(); }; });
    $("app").querySelectorAll("[data-p]").forEach(function (b) { b.onclick = function () { openPlayer(+b.dataset.p); }; });
    var q = $("q");
    if (q) { q.oninput = function () { S.q = q.value; var pos = q.selectionStart; render(); var q2 = $("q"); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) { } }; if (qHad) { q.focus(); } }
  }

  $("bDrive").onclick = fromDrive;
  $("bFile").onclick = function () { setKey(""); S.data = null; try { localStorage.removeItem(KEY); } catch (e) { } S.needKey = true; render(); };
  $("fileIn").onchange = function () { if (this.files && this.files[0]) fromFile(this.files[0]); this.value = ""; };
  $("sheetbg").onclick = function (e) { if (e.target === $("sheetbg")) closeSheet(); };

  var wasWide = isWide();
  window.addEventListener("resize", function () { var w = isWide(); if (w !== wasWide) { wasWide = w; render(); } });
  loadCache();
  render();
  fromDrive();
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !S.busy && !S.needKey) fromDrive(); });
})();
</script>

</body></html>
