<script>
(function () {

  function keyForm() {

    pg.onclick = function () { var v = $("pw").value.trim(); if (v) { setKey(v); S.needKey = false; S.err = ""; fromDrive(); } };
    $("pw").onkeydown = function (e) { if (e.key === "Enter") pg.click(); };
  }

  function fromFile(file) {

    r.onload = function () {
      try { accept(JSON.parse(r.result), "bestand op de telefoon", ""); saveCache(); S.status = "Bestand geladen."; S.err = ""; setTimeout(function () { S.status = ""; render(); }, 3500); }
      catch (e) { S.err = "Dit bestand lukt niet: " + (e.message || "geen geldig HAS-telefoonbestand."); }

  /* ---------- weergave ---------- */
  function cur() { return S.data && S.data.matches.find(function (m) { return m.fixture.id === S.sel; }); }
  function teamOf(m, i) { return S.data.teams[i === 0 ? m.home_id : m.away_id] || null; }

    $("app").querySelectorAll("[data-unhide]").forEach(function (x) { x.onclick = function () { S.hidden = []; saveHidden(); render(); }; });
    $("app").querySelectorAll("[data-m]").forEach(function (b) { b.onclick = function () { S.sel = +b.dataset.m; S.pl = null; S.q = ""; S.flt = "all"; render(); window.scrollTo(0, 0); }; });
    $("app").querySelectorAll("[data-t]").forEach(function (b) { b.onclick = function () { S.tab = b.dataset.t; S.q = ""; S.flt = "all"; render(); }; });
    $("app").querySelectorAll("[data-f]").forEach(function (b) { b.onclick = function () { S.flt = b.dataset.f; render(); }; });
    fitRows();
    var bS = $("bStand"); if (bS) bS.onclick = openStand;
    var bT = $("bTops"); if (bT) bT.onclick = openTops; var bAr = $("bArch"); if (bAr) bAr.onclick = function () { openArchief(0); };
    var bO = $("bOrder"); if (bO) bO.onclick = function () { S.reorder = !S.reorder; render(); };
    $("app").querySelectorAll("[data-mv]").forEach(function (x) { x.onclick = function (e) { e.stopPropagation(); moveMatch(+x.dataset.mv, +x.dataset.dir); }; });
    $("app").querySelectorAll("[data-fm]").forEach(function (b) { b.onclick = function () { openForm(b.dataset.club, b.dataset.fm, b.dataset.sex); }; });
    $("app").querySelectorAll("[data-p]").forEach(function (b) { b.onclick = function () { openPlayer(+b.dataset.p); }; });
    var q = $("q");
    if (q) { q.oninput = function () { S.q = q.value; var pos = q.selectionStart; render(); var q2 = $("q"); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) { } }; if (qHad) { q.focus(); } }
  }

  $("bDrive").onclick = fromDrive;
  $("bFile").onclick = logout;
  $("fileIn").onchange = function () { if (this.files && this.files[0]) fromFile(this.files[0]); this.value = ""; };
  $("sheetbg").onclick = function (e) { if (e.target === $("sheetbg")) closeSheet(); };

  var wasWide = isWide();
  window.addEventListener("resize", function () { var w = isWide(); if (w !== wasWide) { wasWide = w; render(); } });
  loadCache();
  render();
  fromDrive();
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !S.busy && !S.needKey) fromDrive(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () { });
})();
